<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chessboard</title>
  <style>
    body {
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chessboard {
      border: 8px solid #222;
      box-shadow: 0 0 20px #0008;
    }
    .row {
      height: 64px;
      white-space: nowrap;
    }
    .square {
      width: 64px;
      height: 64px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 2.5rem;
      user-select: none;
    }
    .white { background: #ffffff; }
    .black { background: #000000; }
    .piece-blue { color: #008cff; }
    .piece-orange { color: #ff9900; }
  </style>
</head>
<body>
  <div class="chessboard">
    <!-- Row 8 -->
    <div class="row">
      <div class="square white"><span class="piece-blue">♖</span></div>
      <div class="square black"><span class="piece-blue">♘</span></div>
      <div class="square white"><span class="piece-blue">♗</span></div>
      <div class="square black"><span class="piece-blue">♕</span></div>
      <div class="square white"><span class="piece-blue">♔</span></div>
      <div class="square black"><span class="piece-blue">♗</span></div>
      <div class="square white"><span class="piece-blue">♘</span></div>
      <div class="square black"><span class="piece-blue">♖</span></div>
    </div>
    <!-- Row 7 -->
    <div class="row">
      <div class="square black"><span class="piece-blue">♙</span></div>
      <div class="square white"><span class="piece-blue">♙</span></div>
      <div class="square black"><span class="piece-blue">♙</span></div>
      <div class="square white"><span class="piece-blue">♙</span></div>
      <div class="square black"><span class="piece-blue">♙</span></div>
      <div class="square white"><span class="piece-blue">♙</span></div>
      <div class="square black"><span class="piece-blue">♙</span></div>
      <div class="square white"><span class="piece-blue">♙</span></div>
    </div>
    <!-- Row 6 -->
    <div class="row">
      <div class="square white"></div>
      <div class="square black"></div>
      <div class="square white"></div>
      <div class="square black"></div>
      <div class="square white"></div>
      <div class="square black"></div>
      <div class="square white"></div>
      <div class="square black"></div>
    </div>
    <!-- Row 5 -->
    <div class="row">
      <div class="square black"></div>
      <div class="square white"></div>
      <div class="square black"></div>
      <div class="square white"></div>
      <div class="square black"></div>
      <div class="square white"></div>
      <div class="square black"></div>
      <div class="square white"></div>
    </div>
    <!-- Row 4 -->
    <div class="row">
      <div class="square white"></div>
      <div class="square black"></div>
      <div class="square white"></div>
      <div class="square black"></div>
      <div class="square white"></div>
      <div class="square black"></div>
      <div class="square white"></div>
      <div class="square black"></div>
    </div>
    <!-- Row 3 -->
    <div class="row">
      <div class="square black"></div>
      <div class="square white"></div>
      <div class="square black"></div>
      <div class="square white"></div>
      <div class="square black"></div>
      <div class="square white"></div>
      <div class="square black"></div>
      <div class="square white"></div>
    </div>
    <!-- Row 2 -->
    <div class="row">
      <div class="square white"><span class="piece-orange">♟</span></div>
      <div class="square black"><span class="piece-orange">♟</span></div>
      <div class="square white"><span class="piece-orange">♟</span></div>
      <div class="square black"><span class="piece-orange">♟</span></div>
      <div class="square white"><span class="piece-orange">♟</span></div>
      <div class="square black"><span class="piece-orange">♟</span></div>
      <div class="square white"><span class="piece-orange">♟</span></div>
      <div class="square black"><span class="piece-orange">♟</span></div>
    </div>
    <!-- Row 1 -->
    <div class="row">
      <div class="square black"><span class="piece-orange">♜</span></div>
      <div class="square white"><span class="piece-orange">♞</span></div>
      <div class="square black"><span class="piece-orange">♝</span></div>
      <div class="square white"><span class="piece-orange">♛</span></div>
      <div class="square black"><span class="piece-orange">♚</span></div>
      <div class="square white"><span class="piece-orange">♝</span></div>
      <div class="square black"><span class="piece-orange">♞</span></div>
      <div class="square white"><span class="piece-orange">♜</span></div>
    </div>
  </div>
</body>
</html>
